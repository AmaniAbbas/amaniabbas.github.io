<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0d0d16"/>
      <stop offset="100%" stop-color="#08080e"/>
    </linearGradient>
    <linearGradient id="letter" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#00FFCC"/>
      <stop offset="100%" stop-color="#5B8FD4"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="1.2" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>
  <rect width="32" height="32" rx="7" fill="url(#bg)"/>
  <rect width="32" height="32" rx="7" fill="none" stroke="rgba(91,143,212,0.28)" stroke-width="0.8"/>
  <text x="2" y="23" font-family="'Syne', Georgia, serif" font-weight="800" font-size="16" fill="url(#letter)" filter="url(#glow)">A</text>
  <text x="16" y="23" font-family="'Syne', Georgia, serif" font-weight="800" font-size="16" fill="rgba(91,143,212,0.28)">A</text>
</svg>
